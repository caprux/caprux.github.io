# Setiap kali file Word di folder stories/ ditambah, diganti, atau dihapus,
# GitHub otomatis mengubahnya jadi halaman cerita (stories/html + stories/stories.json).
name: Build cerita dari Word

on:
  push:
    paths:
      - 'stories/*.docx'
      - 'scripts/build-stories.js'
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: build-stories
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang mammoth (pembaca Word)
        run: npm ci --no-audit --no-fund

      - name: Ubah Word jadi halaman cerita
        run: node scripts/build-stories.js

      - name: Simpan hasil ke repo
        run: |
          git config user.name "caprux-bot"
          git config user.email "caprux-bot@users.noreply.github.com"
          git add stories
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "build cerita otomatis"
            git pull --rebase
            git push
          fi
