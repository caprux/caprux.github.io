<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPRUX — Artefak</title>
  <link rel="icon" type="image/png" href="LOGO_TRANSPARAN_HITAM.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css?v=25">
  <script src="perf-patch.js?v=25"></script>
</head>
<body data-page="product">

<div class="breadcrumb">
  <a href="index.html">Beranda</a><span class="bc-sep">›</span>
  <a href="produk.html">Artefak</a><span class="bc-sep">›</span>
  <span class="bc-cur">Memuat...</span>
</div>

<div class="product-page">
  <div class="product-grid">
    <div class="gallery reveal-left">
      <div class="gallery-main">
        <img src="" alt="Product" id="mainImg">
      </div>
      <div class="thumbs"></div>
    </div>

    <div class="prod-info reveal-right">
      <div class="prod-eyebrow">// ARTEFAK</div>
      <h1 class="prod-name">NAMA<br>PRODUK</h1>
      <div class="prod-type">Jenis</div>
      <div class="divider"></div>
      <div class="price-row">
        <span class="price">Rp 0</span>
        <span class="status s-soon">◇ UNDISCOVERED</span>
      </div>
      <p class="prod-desc">Deskripsi</p>

      <div class="cta-block">
        <button class="btn-primary" disabled>◇ Segera Tiba</button>
        <a href="produk.html" class="btn-ghost">← Koleksi Lainnya</a>
      </div>

      <div class="notify-block">
        <div class="block-label">// Ingin tahu saat tersedia?</div>
        <div class="notify-row">
          <input class="notify-in" type="email" placeholder="email@kamu.com" id="notifyEmail" autocomplete="email">
          <button class="notify-btn" type="button" onclick="handleNotify()">Beritahu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="related">
  <p class="eyebrow reveal">// DARI KOLEKSI YANG SAMA</p>
  <h2 class="sec-title reveal">Artefak Lainnya</h2>
  <div class="rel-divider reveal"></div>
  <div class="rel-grid reveal-scale"></div>
</section>

<script src="caprux-data.js?v=25" defer></script>
<script src="script.js?v=25" defer></script>
</body>
</html>
